trigger: none

pr: none

parameters:
  - name: targetEnvironment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - uat

  - name: targetRegion
    displayName: Target region
    type: string
    default: us-east-1
    values:
      - us-east-1
      - eu-central-1
      - ap-southeast-1

  - name: terraformAction
    displayName: Terraform action
    type: string
    default: plan
    values:
      - plan
      - apply

variables:
  terraformVersion: '1.10.0'
  nodeVersion: '20.x'
  workingDirectory: 'environments/${{ parameters.targetEnvironment }}'
  backendBucket: 'bts-cloud-terraform-tfstate'
  backendKey: 'terraform-state/${{ parameters.targetEnvironment }}/${{ parameters.targetRegion }}/connect-v2v-translation/terraform.tfstate'
  backendRegion: 'us-east-1'
  planArtifactName: 'terraform-plan-${{ parameters.targetEnvironment }}-${{ parameters.targetRegion }}-connect-v2v-translation'

stages:
  - stage: plan
    displayName: Plan ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }} V2V translation
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - job: terraform_plan
        displayName: Terraform Plan ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }}
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node
            inputs:
              versionSpec: $(nodeVersion)

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - script: |
              set -euo pipefail
              npm ci
              npm run build
            displayName: Build webapp
            workingDirectory: webapp

          - script: |
              set -euo pipefail

              case '${{ parameters.targetEnvironment }}' in
                dev)
                  AWS_ROLE_ARN='$(AWS_DEV_OIDC_ROLE_ARN)'
                  ;;
                uat)
                  AWS_ROLE_ARN='$(AWS_UAT_OIDC_ROLE_ARN)'
                  ;;
              esac

              if [ -z "$AWS_ROLE_ARN" ] || [[ "$AWS_ROLE_ARN" == \$\(* ]]; then
                echo "AWS OIDC role ARN is not configured for ${{ parameters.targetEnvironment }}."
                exit 1
              fi

              OIDC_RESPONSE="$(curl -sS \
                -X POST \
                -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                -H "Content-Length: 0" \
                "${SYSTEM_OIDCREQUESTURI}?api-version=7.1-preview.1")"
              OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["oidcToken"])')"
              AWS_WEB_IDENTITY_TOKEN_FILE="$(Agent.TempDirectory)/aws-oidc-token"
              printf '%s' "$OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

              export AWS_ROLE_ARN
              export AWS_WEB_IDENTITY_TOKEN_FILE
              export AWS_ROLE_SESSION_NAME="azure-pipelines-${{ parameters.targetEnvironment }}-$(Build.BuildId)"

              terraform init -reconfigure \
                -backend-config="bucket=$(backendBucket)" \
                -backend-config="key=$(backendKey)" \
                -backend-config="region=$(backendRegion)" \
                -backend-config="encrypt=true"

              terraform fmt -recursive ../..
              terraform validate
              terraform plan -var='aws_region=${{ parameters.targetRegion }}' -out=tfplan

              PLAN_ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/terraform-plan"
              mkdir -p "$PLAN_ARTIFACT_DIR"
              cp tfplan "$PLAN_ARTIFACT_DIR/"
              mkdir -p "$PLAN_ARTIFACT_DIR/webapp-dist"
              cp -R ../../webapp/dist/. "$PLAN_ARTIFACT_DIR/webapp-dist/"
            displayName: Terraform Init, Validate, and Plan
            workingDirectory: $(workingDirectory)
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)

          - publish: $(Build.ArtifactStagingDirectory)/terraform-plan
            displayName: Publish Plan
            artifact: $(planArtifactName)

  - stage: apply
    displayName: Apply ${{ parameters.terraformAction }} ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }} V2V translation
    dependsOn: plan
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'apply'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: terraform_apply
        displayName: Terraform Apply ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }}
        environment: ${{ parameters.targetEnvironment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: $(terraformVersion)

                - download: current
                  displayName: Download Plan
                  artifact: $(planArtifactName)

                - script: |
                    set -euo pipefail

                    case '${{ parameters.targetEnvironment }}' in
                      dev)
                        AWS_ROLE_ARN='$(AWS_DEV_OIDC_ROLE_ARN)'
                        ;;
                      uat)
                        AWS_ROLE_ARN='$(AWS_UAT_OIDC_ROLE_ARN)'
                        ;;
                    esac

                    if [ -z "$AWS_ROLE_ARN" ] || [[ "$AWS_ROLE_ARN" == \$\(* ]]; then
                      echo "AWS OIDC role ARN is not configured for ${{ parameters.targetEnvironment }}."
                      exit 1
                    fi

                    OIDC_RESPONSE="$(curl -sS \
                      -X POST \
                      -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                      -H "Content-Length: 0" \
                      "${SYSTEM_OIDCREQUESTURI}?api-version=7.1-preview.1")"
                    OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["oidcToken"])')"
                    AWS_WEB_IDENTITY_TOKEN_FILE="$(Agent.TempDirectory)/aws-oidc-token"
                    printf '%s' "$OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

                    export AWS_ROLE_ARN
                    export AWS_WEB_IDENTITY_TOKEN_FILE
                    export AWS_ROLE_SESSION_NAME="azure-pipelines-${{ parameters.targetEnvironment }}-$(Build.BuildId)"

                    terraform init -reconfigure \
                      -backend-config="bucket=$(backendBucket)" \
                      -backend-config="key=$(backendKey)" \
                      -backend-config="region=$(backendRegion)" \
                      -backend-config="encrypt=true"

                    mkdir -p ../../webapp/dist
                    cp -R "$(Pipeline.Workspace)/$(planArtifactName)/webapp-dist/." ../../webapp/dist/
                    terraform apply -auto-approve "$(Pipeline.Workspace)/$(planArtifactName)/tfplan"
                  displayName: Terraform Apply
                  workingDirectory: $(workingDirectory)
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
